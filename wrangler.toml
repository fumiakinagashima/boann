name = "boann"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

# リマインダー配信: pending な reminders を1分ごとにチェックし、remind_at に達したものを送信する
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "boann"
database_id = ""
migrations_dir = "drizzle"

# KV: 本番デプロイ前に `wrangler kv namespace create boann` を実行し id を本番用の値に置き換えること
# （ローカル開発では id はダミー値で良く、.wrangler/state にローカルKVが作成される）
[[kv_namespaces]]
binding = "KV"
id = "dummy"

# R2: 本番デプロイ前に `wrangler r2 bucket create boann` を実行すること
[[r2_buckets]]
binding = "R2"
bucket_name = "boann"

# Queues: ファイル取り込みによるアプリ生成を非同期実行する。
# 本番デプロイ前に `wrangler queues create boann-imports` を実行すること。
[[queues.producers]]
binding = "QUEUE"
queue = "boann-imports"

[[queues.consumers]]
queue = "boann-imports"
max_batch_size = 10
max_retries = 3

[vars]
# ANTHROPIC_API_KEY は `wrangler secret put ANTHROPIC_API_KEY` で管理する（[vars] に書くと deploy 時にシークレットを空文字で上書きしてしまうため定義しない）
# ローカル開発時のモックモード（.dev.vars で上書き可能）
MOCK_AI = "false"
