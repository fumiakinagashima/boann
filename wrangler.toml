name = "boann"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

main = "worker.ts"
assets = { directory = ".svelte-kit/cloudflare/", binding = "ASSETS" }

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "boann"
# Replace with the database_id of your own D1 database (`wrangler d1 create boann`).
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
# Replace with the id of your own KV namespace (`wrangler kv namespace create KV`).
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Required binding name ("OAUTH_KV") mandated by @cloudflare/workers-oauth-provider.
# Replace with the id of your own KV namespace (`wrangler kv namespace create OAUTH_KV`).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_YOUR_OAUTH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "boann"

[[queues.producers]]
binding = "QUEUE"
queue = "boann"

[[queues.consumers]]
queue = "boann"
max_batch_size = 10
max_retries = 3

[vars]
MOCK_AI = "false"

# Local development environment (used by `vite dev`/`wrangler dev`; selected via
# svelte.config.js's platformProxy.environment = "dev").
# Values may be nonexistent dummies to keep them separate from production resource IDs
# (they're only validated when using --remote).
# Wrangler environments don't inherit d1_databases/kv_namespaces/r2_buckets/queues from
# the top-level definitions above, so the local values are defined explicitly here.
[[env.dev.d1_databases]]
binding = "DB"
database_name = "boann"
database_id = "local"
migrations_dir = "drizzle"

[[env.dev.kv_namespaces]]
binding = "KV"
id = "local"

[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"
id = "local"

[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "boann-local"

[[env.dev.queues.producers]]
binding = "QUEUE"
queue = "boann"

[[env.dev.queues.consumers]]
queue = "boann"
max_batch_size = 10
max_retries = 3

[env.dev.vars]
MOCK_AI = "false"
